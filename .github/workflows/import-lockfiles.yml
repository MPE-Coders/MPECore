name: Import verified baseline lockfiles
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-lockfiles.yml]
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the previously verified public dependency artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MPE-Coders/MPEServer/actions/artifacts/10902431368/zip > "$RUNNER_TEMP/dependencies.zip"
          echo "ec9bef6abcdba74026a3ee67444df20b7916e3016724b2063cebe61753d5d826  $RUNNER_TEMP/dependencies.zip" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile,urllib.request
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'dependencies.zip') as z:
              composer=z.read('build/composer.lock')
              data=json.loads(z.read('build/package-lock.json'))
          assert hashlib.sha256(composer).hexdigest()=='d5b58e1581bf1fb512aee036a64d27624cbe57420f1d0ce68099f3cf3ee66747'
          data['version']='0.5.0';data['packages']['']['version']='0.5.0'
          node=(json.dumps(data,indent=2)+'\n').encode()
          assert hashlib.sha256(node).hexdigest()=='05e884adb9b388aa367afc0876f2de6be2830903f48b666d98c049aff10000db'
          with urllib.request.urlopen('https://raw.githubusercontent.com/Pumpkin-MC/Pumpkin/003d3c49eaf1ca21207671be55a91587bc1330b5/LICENSE',timeout=30) as response:
              license=response.read()
          assert hashlib.sha256(license).hexdigest()=='3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986'
          for name,content in [('composer.lock',composer),('package-lock.json',node),('LICENSE',license)]:
              if Path(name).exists():raise RuntimeError('Refusing to overwrite '+name)
              Path(name).write_bytes(content)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock package-lock.json LICENSE
          git commit -m 'Import verified dependency locks and GPL license for MPECore'
          git push origin HEAD:main
